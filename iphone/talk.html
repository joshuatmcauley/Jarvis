<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0b0b">
  <title>JARVIS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #161616;
      --line: #2a2a2a;
      --green: #00ff7a;
      --text: #f2f2f2;
      --muted: #9a9a9a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { padding: 18px 16px 32px; }
    header { margin-bottom: 18px; }
    h1 {
      margin: 0;
      color: var(--green);
      letter-spacing: 0.18em;
      font-size: 1.4rem;
    }
    .sub { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    textarea, input {
      width: 100%;
      background: #111;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font-size: 1rem;
    }
    textarea { min-height: 120px; resize: vertical; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button, a.btn {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      color: #04140a;
      background: var(--green);
      cursor: pointer;
    }
    button.secondary, a.btn.secondary {
      background: #262626;
      color: var(--text);
    }
    button:disabled { opacity: 0.45; }
    #mic {
      width: 100%;
      height: 88px;
      border-radius: 16px;
      font-size: 1.2rem;
    }
    #mic.live { background: #ff3b30; color: white; }
    .status { color: var(--muted); font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    .log { max-height: 240px; overflow: auto; font-size: 0.9rem; }
    .log div { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .log time { color: var(--muted); font-size: 0.75rem; display: block; }
  </style>
</head>
<body>
  <header>
    <h1>JARVIS</h1>
    <p class="sub">Speak on your iPhone. Same Cursor agent. Notes stay on this phone and in the repo.</p>
  </header>

  <div class="card">
    <button id="mic" type="button">Hold to speak — or tap</button>
    <p class="status" id="status">Ready. Safari works best for voice.</p>
  </div>

  <div class="card">
    <label for="note">What you said</label>
    <textarea id="note" placeholder="Your voice note lands here"></textarea>
    <div class="row">
      <a class="btn" id="openAgent" href="https://cursor.com/agents/bc-552ac9dc-5afe-44f5-bf2b-9ee0d966172e">Open same agent</a>
      <button class="secondary" id="copy" type="button">Copy for Cursor</button>
      <button class="secondary" id="save" type="button">Save locally</button>
    </div>
  </div>

  <div class="card">
    <label for="apiKey">Cursor API key (stays on this iPhone, never uploaded)</label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="Optional — enables Send to agent">
    <div class="row">
      <button id="send" type="button">Send to same agent</button>
      <button class="secondary" id="clearKey" type="button">Forget key</button>
    </div>
    <p class="status">Get a key at cursor.com/dashboard/api. If Safari blocks the request, use the Siri Shortcut instead.</p>
  </div>

  <div class="card">
    <label>Saved on this iPhone</label>
    <div class="log" id="log"></div>
  </div>

  <script>
    const AGENT_ID = "bc-552ac9dc-5afe-44f5-bf2b-9ee0d966172e";
    const AGENT_URL = "https://cursor.com/agents/" + AGENT_ID;
    const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
    const note = document.getElementById("note");
    const status = document.getElementById("status");
    const mic = document.getElementById("mic");
    const logEl = document.getElementById("log");
    const apiKey = document.getElementById("apiKey");
    let recognition = null;
    let listening = false;

    document.getElementById("openAgent").href = AGENT_URL;
    apiKey.value = localStorage.getItem("jarvisCursorKey") || "";

    function loadLog() {
      const items = JSON.parse(localStorage.getItem("jarvisNotes") || "[]");
      logEl.innerHTML = items.slice().reverse().map((item) => {
        return "<div><time>" + item.at + "</time>" + escapeHtml(item.text) + "</div>";
      }).join("") || "<div>No notes yet.</div>";
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function saveNote(text) {
      const clean = text.trim();
      if (!clean) return;
      const items = JSON.parse(localStorage.getItem("jarvisNotes") || "[]");
      items.push({ at: new Date().toISOString(), text: clean });
      localStorage.setItem("jarvisNotes", JSON.stringify(items.slice(-80)));
      loadLog();
    }

    function setStatus(text) { status.textContent = text; }

    function startListen() {
      if (!Speech) {
        setStatus("Voice needs Safari. Type instead, then Open same agent.");
        return;
      }
      if (listening) return;
      recognition = new Speech();
      recognition.lang = "en-GB";
      recognition.continuous = true;
      recognition.interimResults = true;
      let finalText = note.value ? note.value + " " : "";
      recognition.onresult = (event) => {
        let interim = "";
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const chunk = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalText += chunk + " ";
          else interim += chunk;
        }
        note.value = (finalText + interim).trim();
      };
      recognition.onerror = (event) => setStatus("Mic: " + event.error);
      recognition.onend = () => {
        listening = false;
        mic.classList.remove("live");
        mic.textContent = "Hold to speak — or tap";
        setStatus("Stopped. Copy or send to the same Cursor agent.");
      };
      recognition.start();
      listening = true;
      mic.classList.add("live");
      mic.textContent = "Listening — tap to stop";
      setStatus("Listening…");
    }

    function stopListen() {
      if (recognition && listening) recognition.stop();
    }

    mic.addEventListener("click", () => listening ? stopListen() : startListen());
    document.getElementById("save").addEventListener("click", () => {
      saveNote(note.value);
      setStatus("Saved on this iPhone.");
    });
    document.getElementById("copy").addEventListener("click", async () => {
      const text = note.value.trim();
      if (!text) return;
      await navigator.clipboard.writeText(text);
      setStatus("Copied. Paste into the open agent.");
    });
    apiKey.addEventListener("change", () => {
      localStorage.setItem("jarvisCursorKey", apiKey.value.trim());
    });
    document.getElementById("clearKey").addEventListener("click", () => {
      apiKey.value = "";
      localStorage.removeItem("jarvisCursorKey");
    });
    document.getElementById("send").addEventListener("click", async () => {
      const text = note.value.trim();
      const key = apiKey.value.trim();
      if (!text) { setStatus("Say or type something first."); return; }
      if (!key) { setStatus("Add a Cursor API key, or tap Open same agent."); return; }
      localStorage.setItem("jarvisCursorKey", key);
      const body = {
        prompt: {
          text: text + "\n\nSave anything lasting in memory/ and commit it. I am talking from iPhone."
        }
      };
      try {
        const response = await fetch("https://api.cursor.com/v1/agents/" + AGENT_ID + "/runs", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });
        if (response.ok) {
          saveNote(text);
          setStatus("Sent to the same agent. Opening it…");
          window.location.href = AGENT_URL;
          return;
        }
        const err = await response.text();
        setStatus("API " + response.status + ": " + err.slice(0, 180) + " — use the Siri Shortcut if Safari blocked this.");
      } catch (error) {
        setStatus("Safari blocked the API call. Use the Siri Shortcut in iphone/shortcut-recipe.md.");
      }
    });
    loadLog();
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  </script>
</body>
</html>
